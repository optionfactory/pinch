# yaml-language-server: $schema=https://raw.githubusercontent.com/optionfactory/pinch/refs/heads/master/schema/pinch-v1.schema.json
schema_version: 1
project:
   name: "An example dashboard"
processes:
  - name: "system-monitor"
    run: "top"
    mode: "tui"
  - name: "cpu-mem-stats"
    run: "vmstat 1"
  - name: "ping"
    run: "ping 8.8.8.8"
  - name: "disk-usage"
    run: "watch -n 5 df -h"
    mode: "tui"
  - name: "fake-job"
    run: 
      type: process
      shell: bash
      cmd: 'while true; do echo "[Service] Processing task $RANDOM..."; sleep 1.5; done'
layout:
  # 1. Carve out the left 35% of the screen.
  # Stack our primary system monitors vertically.
  - edge: "left"
    size: 35
    direction: "vertical"
    items:
      - name: "system-monitor"
        size: 60
      - name: "cpu-mem-stats"
        size: 40
  # 2. Carve out the bottom 30% of the REMAINING screen.
  # Display logs side-by-side.
  - edge: "bottom"
    size: 30
    direction: "horizontal"
    items:
      - name: "combined-logs" # The special global logs panel
      - name: "fake-job" # Our bash loop generating fake logs
  # 3. Unassigned Panes
  # "ping" and "disk-usage" are not mentioned in the layout.
