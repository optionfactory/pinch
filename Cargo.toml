[package]
name = "pinch"
version = "1.0.0"
edition = "2024"

[lib]
name = "pinch"
path = "src/lib.rs"

[[bin]]
name = "pinch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0.151"
schemars = { version = "1.2", features = ["derive"] }

ansi-to-tui = "8.0.1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
notify = "8.2.0"
open = "5.4"
portable-pty = "0.9.0"
ratatui = "0.30.2"
shlex = "2.0.1"
tokio = { version = "1.53", features = ["full"] }
tui-term = "0.3"
vt100 = "0.16.2"
libc = "0.2"


[build-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
