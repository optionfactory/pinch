[package]
name = "pinch"
version = "1.0.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.33"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
shlex = "2.0.1"
tokio = { version = "1.53.1", features = ["full"] }
vt100 = "0.16.2"
tui-term = "0.3"
notify = "8.2.0"
open = "5.4"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
schemars = { version = "1.2", features = ["derive"] }

[build-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"