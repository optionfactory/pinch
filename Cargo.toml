[package]
name = "pinch"
version = "1.0.0"
edition = "2024"

[features]
# The standalone pinch CLI keeps everything enabled by default
default = ["supervisor"]

# Heavy CLI, supervision, execution, and TUI dependencies
supervisor = [
    "dep:ansi-to-tui",
    "dep:clap",
    "dep:clap_complete",
    "dep:crossterm",
    "dep:futures",
    "dep:notify",
    "dep:open",
    "dep:portable-pty",
    "dep:ratatui",
    "dep:shlex",
    "dep:tokio",
    "dep:tui-term",
    "dep:vt100",
]

[lib]
name = "pinch"
path = "src/lib.rs"

[[bin]]
name = "pinch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
schemars = { version = "1.2", features = ["derive"] }

ansi-to-tui = { version = "8.0.1", optional = true }
clap = { version = "4.6", features = ["derive", "env"], optional = true }
clap_complete = { version = "4.6", optional = true }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
futures = { version = "0.3.33", optional = true }
notify = { version = "8.2.0", optional = true }
open = { version = "5.4", optional = true }
portable-pty = { version = "0.9.0", optional = true }
ratatui = { version = "0.30.2", optional = true }
shlex = { version = "2.0.1", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tui-term = { version = "0.3", optional = true }
vt100 = { version = "0.16.2", optional = true }


[build-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"